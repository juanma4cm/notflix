services:

  caddy:
    image: caddy:${CADDY_VERSION:-2-alpine}
    container_name: caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - DOMAIN=${DOMAIN:-notflix.internal}
    restart: unless-stopped
    networks:
      - media-network

  dnsmasq:
    image: ricardbejarano/dnsmasq:latest
    container_name: dnsmasq
    ports:
      - "53:1053/udp"
      - "53:1053/tcp"
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - media-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION:-latest}
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./qbittorrent/config:/config
      - ./downloads:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION:-latest}
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9696"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Europe/Madrid}
    restart: unless-stopped
    networks:
      - media-network

  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION:-latest}
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./radarr/config:/config
      - ./downloads:/downloads
      - ./movies:/movies
    restart: unless-stopped
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7878"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION:-latest}
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./sonarr/config:/config
      - ./downloads:/downloads
      - ./tv:/tv
    restart: unless-stopped
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8989"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_VERSION:-latest}
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./jellyfin/config:/config
      - ./movies:/movies:ro
      - ./tv:/tv:ro
    restart: unless-stopped
    networks:
      - media-network

  jellyseerr:
    image: fallenbagel/jellyseerr:${JELLYSEERR_VERSION:-latest}
    container_name: jellyseerr
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./jellyseerr/config:/app/config
    restart: unless-stopped
    networks:
      - media-network

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./recyclarr:/config
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Madrid}
    restart: "no"
    networks:
      - media-network

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - ./diun/diun.yml:/diun.yml:ro
      - ./diun/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-Europe/Madrid}
    restart: unless-stopped
    networks:
      - media-network

  provisioner:
    build: ./provisioner
    container_name: provisioner
    env_file: .env
    volumes:
      - ./radarr/config:/config/radarr
      - ./sonarr/config:/config/sonarr
      - ./prowlarr/config:/config/prowlarr
      - ./config-templates:/templates:ro
      - ./dnsmasq:/dnsmasq
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    restart: "no"
    networks:
      - media-network

networks:
  media-network:
    driver: bridge
