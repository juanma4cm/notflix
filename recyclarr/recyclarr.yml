---
# Recyclarr — Quality Profiles como código
# Sincroniza custom formats y perfiles de calidad desde TRaSH-Guides
# Ejecutar con: make recyclarr
#
# Docs: https://recyclarr.dev/wiki/yaml/
# TRaSH-Guides IDs: https://trash-guides.info/

radarr:
  notflix-radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_profiles:
      - name: "Español HD"
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p

    custom_formats:
      - trash_ids:
          # Spanish Audio / Releases
          - 4b900e171accbfb172729b63323f9d5e  # Blu-ray
          - 9965a052eb87b0d10313b1cea89eb451  # HDR
        assign_scores_to:
          - name: "Español HD"
            score: 500

sonarr:
  notflix-sonarr:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    quality_profiles:
      - name: "Español HD Series"
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p

    custom_formats:
      - trash_ids:
          - 4b900e171accbfb172729b63323f9d5e  # Blu-ray
          - 9965a052eb87b0d10313b1cea89eb451  # HDR
        assign_scores_to:
          - name: "Español HD Series"
            score: 500
